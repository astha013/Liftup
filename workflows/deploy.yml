name: CI/CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Build Docker images
        run: |
          docker build -t liftup-frontend:latest ./client
          docker build -t liftup-hardhat:latest ./contracts

      - name: Save images as artifact
        run: |
          docker save liftup-frontend:latest > frontend.tar
          docker save liftup-hardhat:latest > hardhat.tar
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: docker-images
          path: |
            frontend.tar
            hardhat.tar
