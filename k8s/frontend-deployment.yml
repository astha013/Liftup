apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: liftup-frontend
  template:
    metadata:
      labels:
        app: liftup-frontend
    spec:
      containers:
      - name: liftup-frontend
        image: astha013/liftup-frontend:latest
        ports:
        - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: liftup-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30001
