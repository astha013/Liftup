name: Docker Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2
      - name: Build frontend
        run: docker build -t liftup-frontend ./client
      - name: Build hardhat
        run: docker build -t liftup-hardhat ./hardhat
